<div class="mall-form-control">
    <label for="{{ type }}_company">{{ 'webbook.mall::frontend.form.company'|trans }}</label>
    <input id="{{ type }}_company" type="text"
           placeholder="{{ 'webbook.mall::frontend.form.company_placeholder'|trans }}" name="{{ type }}_company">
    <div data-validate-for="{{ type }}_company"></div>
</div>
<div class="mall-form-control">
    <label for="{{ type }}_phone">{{ 'webbook.mall::frontend.form.phone'|trans }}</label>
    <input id="{{ type }}_phone" type="text" name="{{ type }}_phone">
    <div data-validate-for="{{ type }}_phone"></div>
</div>
<div class="mall-two-fields">
    <div class="mall-form-control">
        <label for="{{ type }}_tin">{{ 'webbook.mall::frontend.form.tin'|trans }}</label>
        <input id="{{ type }}_tin" name="{{ type }}_tin" type="text">
        <div data-validate-for="{{ type }}_tin"></div>
    </div>
    <div class="mall-form-control">
        <label for="{{ type }}_vat">{{ 'webbook.mall::frontend.form.vat'|trans }}</label>
        <input id="{{ type }}_vat" name="{{ type }}_vat" type="text">
        <div data-validate-for="{{ type }}_vat"></div>
    </div>
</div>
<div class="mall-form-control">
    <label for="{{ type }}_address_name">{{ 'webbook.mall::frontend.form.recipient'|trans }}</label>
    <input id="{{ type }}_address_name" type="text"
           placeholder="{{ 'webbook.mall::frontend.form.recipient_placeholder'|trans }}"
           name="{{ type }}_address_name">
    <div data-validate-for="{{ type }}_address_name"></div>
</div>
<div class="mall-form-control">
    <label for="{{ type }}_lines">{{ 'webbook.mall::frontend.form.address_lines'|trans }}</label>
    <textarea id="{{ type }}_lines" type="text" name="{{ type }}_lines"></textarea>
    <div data-validate-for="{{ type }}_lines"></div>
</div>
<div class="mall-two-fields">
    <div class="mall-form-control">
        <label for="{{ type }}_zip">{{ 'webbook.mall::frontend.form.zip'|trans }}</label>
        <input id="{{ type }}_zip" name="{{ type }}_zip" type="text">
        <div data-validate-for="{{ type }}_zip"></div>
    </div>
    <div class="mall-form-control">
        <label for="{{ type }}_city">{{ 'webbook.mall::frontend.form.city'|trans }}</label>
        <input id="{{ type }}_city" name="{{ type }}_city" type="text">
        <div data-validate-for="{{ type }}_city"></div>
    </div>
</div>
<div class="{{ __SELF__.useState ? 'mall-two-fields' }}" id="countryState_{{ type }}">
    {% partial __SELF__ ~ '::countrystate' type=type %}
</div>
