fields:
    name:
        label: 'webbook.mall::lang.order_states.name'
        oc.commentPosition: ''
        span: left
        type: text
    flag:
        label: 'webbook.mall::lang.order_states.flag'
        oc.commentPosition: ''
        emptyOption: '--'
        span: right
        type: dropdown
    is_enabled:
        type: switch
        label: webbook.mall::lang.order_state_settings.is_enabled
        span: left
        default: true
    is_internal:
        type: switch
        label: webbook.mall::lang.order_state_settings.is_internal
        span: right
    display_state:
        label: 'webbook.mall::lang.order_state_settings.display_state'
        oc.commentPosition: ''
        emptyOption: '--'
        comment: 'webbook.mall::lang.order_state_settings.display_state_comment'
        type: dropdown
        trigger:
            action: show
            field: is_internal
            condition: checked
    description:
        label: 'webbook.mall::lang.product.description'
        size: large
        oc.commentPosition: ''
        span: auto
        type: textarea
    color:
        label: 'webbook.mall::lang.order_states.color'
        oc.commentPosition: ''
        span: auto
        type: colorpicker
